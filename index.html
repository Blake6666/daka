<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fitlog 健身记录</title>
  <style>
    /* Day 2 占位页：样式只求能看，不求好看。
       Day 7 生成正式 MVP 时这个文件会被替换掉。 */
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f1115;
      color: #e8eaed;
      margin: 0;
      padding: 48px 20px;
      display: flex;
      justify-content: center;
    }
    .wrap { max-width: 560px; width: 100%; }
    h1 { font-size: 28px; margin: 0 0 6px; }
    .sub { color: #9aa0a6; font-size: 14px; margin-bottom: 32px; }
    .badge {
      display: inline-block;
      background: #332b00;
      color: #ffd666;
      border: 1px solid #665500;
      border-radius: 4px;
      padding: 3px 9px;
      font-size: 12px;
      margin-bottom: 28px;
    }
    .cards { display: flex; gap: 12px; flex-wrap: wrap; }
    .card {
      flex: 1 1 150px;
      background: #1a1d23;
      border: 1px solid #2a2e37;
      border-radius: 8px;
      padding: 18px 16px;
    }
    .card h2 { font-size: 17px; margin: 0 0 6px; }
    .card p { font-size: 13px; color: #9aa0a6; margin: 0; line-height: 1.6; }
    footer { margin-top: 36px; font-size: 12px; color: #5f6368; line-height: 1.8; }
    code { background: #1a1d23; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>fitlog 健身记录</h1>
    <p class="sub">训练 · 饮食 · 睡眠　三个版块</p>

    <span class="badge">占位页 — 正式版在 Day 7 生成</span>

    <div class="cards">
      <div class="card">
        <h2>训练记录</h2>
        <p>动作、重量、组数、次数<br>按器械类型分开统计训练量</p>
      </div>
      <div class="card">
        <h2>饮食记录</h2>
        <p>食物、克数、餐次<br>热量按每 100 克自动换算</p>
      </div>
      <div class="card">
        <h2>睡眠记录</h2>
        <p>入睡、起床、时长<br>午睡单独记，不混进夜间</p>
      </div>
    </div>

    <footer>
      这是 Day 2 的占位页，只用来证明文件已成功推送到 GitHub。<br>
      今天的任务清单在 <code>AGENTS.md</code> 里，Day 7 会按它生成正式页面。
    </footer>
  </div>
</body>
</html>
